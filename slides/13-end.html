<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>13 · 结尾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<script src="../shared/lock.js"></script>
<style>
  .end-slide { position: relative; }
  .worldmap {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 40%;
    opacity: 0.92;
    z-index: 0;
  }
  .slogan {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .slogan-box {
    background: rgba(244, 244, 240, 0.90);
    border: 2px solid var(--ink);
    padding: 46px 80px 40px;
    position: relative;
  }
  .slogan-box::before,
  .slogan-box::after {
    content: "";
    position: absolute;
    width: 22px; height: 22px;
    border-color: var(--safety);
    border-style: solid;
  }
  .slogan-box::before { top: -8px; left: -8px; border-width: 3px 0 0 3px; }
  .slogan-box::after { bottom: -8px; right: -8px; border-width: 0 3px 3px 0; }
  .slogan h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 132px;
    line-height: 1.05;
    letter-spacing: 0.02em;
    color: var(--ink);
    text-transform: uppercase;
  }
  .slogan h1 .hl { color: var(--safety-dark); }
  .slogan .sub {
    font-size: 30px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin-top: 22px;
    max-width: 1400px;
  }
  .slogan .sub b { color: var(--ink); }
  .legend {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    gap: 28px;
    align-items: center;
    background: rgba(20,23,26,0.88);
    padding: 10px 26px;
  }
  .legend .item { display: flex; align-items: center; gap: 9px; font-family: var(--font-mono); font-size: 14px; color: #fff; letter-spacing: 0.08em; }
  .legend .sw { width: 16px; height: 16px; display: inline-block; }
  .sw.hl { background: var(--safety); }
  .sw.oth { background: #E3E2DB; }
</style>
</head>
<body>
<div class="slide corner-brackets end-slide">

  <!-- 世界地图底图（美欧高亮） -->
  <img class="worldmap" src="../assets/world-map.svg" alt="世界地图 · 美国与欧洲高亮">

  <!-- 口号 -->
  <div class="slogan">
    <div class="slogan-box">
      <h1>需求已来，<span class="hl">时不我待</span></h1>
      <div class="sub">流量增长印证了全球市场的<b>强烈需求</b>，抓住机遇还是让出<b>市场份额</b>？</div>
    </div>
  </div>

  <!-- 图例 -->
  <div class="legend">
    <div class="item"><span class="sw hl"></span>美国 · 欧洲 · 核心市场</div>
    <div class="item"><span class="sw oth"></span>其他市场</div>
  </div>

  <div class="page-footer" style="left:110px; right:110px; bottom:34px; z-index:3;">
    <div class="section">13 / 13 · End</div>
    <div class="pageno"><b>FBK</b> POWER · Retrospective</div>
  </div>
</div>
</body>
</html>
